<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cream: #f5ede0;
      --warm-white: #fdf8f2;
      --gold: #c8972a;
      --gold-light: #e8b84b;
      --charcoal: #1a1410;
      --rust: #8b3a1e;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--charcoal);
    }

    /* ── BACKGROUND ── */
    .bg {
      position: fixed;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1800&q=80');
      background-size: cover;
      background-position: center 40%;
      transform: scale(1.04);
      animation: slowZoom 20s ease-in-out infinite alternate;
    }

    @keyframes slowZoom {
      from { transform: scale(1.04); }
      to   { transform: scale(1.10); }
    }

    /* dark + warm gradient overlay */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(160deg, rgba(10,6,3,0.72) 0%, rgba(20,10,5,0.55) 40%, rgba(140,55,20,0.28) 100%),
        linear-gradient(to top, rgba(10,6,3,0.85) 0%, transparent 55%);
    }

    /* grain texture */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 180px;
    }

    /* ── LAYOUT ── */
    .stage {
      position: relative;
      z-index: 2;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* ── EYEBROW ── */
    .eyebrow {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: var(--gold-light);
      opacity: 0;
      animation: fadeUp 0.9s 0.3s ease forwards;
    }

    /* ── DIVIDER ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.4rem 0 1.2rem;
      opacity: 0;
      animation: fadeUp 0.9s 0.55s ease forwards;
    }
    .divider span {
      display: block;
      width: 50px;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold));
    }
    .divider span:last-child {
      background: linear-gradient(to left, transparent, var(--gold));
    }
    .divider svg {
      width: 14px;
      height: 14px;
      fill: var(--gold);
      opacity: 0.85;
    }

    /* ── HEADLINE ── */
    .headline {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.4rem, 9vw, 7.5rem);
      font-weight: 700;
      line-height: 0.92;
      color: var(--warm-white);
      letter-spacing: -0.01em;
      opacity: 0;
      animation: fadeUp 1s 0.7s ease forwards;
    }
    .headline em {
      font-style: italic;
      color: var(--gold-light);
      font-weight: 400;
    }

    /* ── SUBHEADING ── */
    .sub {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1rem, 2.2vw, 1.3rem);
      font-weight: 300;
      color: rgba(245,237,224,0.72);
      margin-top: 1.6rem;
      max-width: 460px;
      line-height: 1.65;
      opacity: 0;
      animation: fadeUp 0.9s 0.95s ease forwards;
    }

    /* ── COUNTDOWN ── */
    .countdown {
      display: flex;
      gap: clamp(1.2rem, 3vw, 2.4rem);
      margin-top: 3rem;
      opacity: 0;
      animation: fadeUp 0.9s 1.15s ease forwards;
    }
    .unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
    }
    .unit-num {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      color: var(--warm-white);
      line-height: 1;
      min-width: 3ch;
      text-align: center;
    }
    .unit-label {
      font-size: 0.6rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 400;
    }
    .dot-sep {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      color: var(--gold);
      opacity: 0.5;
      line-height: 1;
      align-self: flex-start;
      margin-top: 0.1em;
    }

    /* ── EMAIL ── */
    .notify {
      margin-top: 2.8rem;
      display: flex;
      align-items: center;
      gap: 0;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(200,151,42,0.35);
      border-radius: 3px;
      overflow: hidden;
      backdrop-filter: blur(10px);
      opacity: 0;
      animation: fadeUp 0.9s 1.35s ease forwards;
    }
    .notify input {
      background: transparent;
      border: none;
      outline: none;
      padding: 0.85rem 1.3rem;
      color: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.03em;
      width: clamp(180px, 28vw, 260px);
    }
    .notify input::placeholder { color: rgba(245,237,224,0.38); }
    .notify button {
      background: var(--gold);
      border: none;
      cursor: pointer;
      padding: 0.85rem 1.5rem;
      color: var(--charcoal);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: background 0.25s ease;
      white-space: nowrap;
    }
    .notify button:hover { background: var(--gold-light); }

    /* ── BOTTOM BAR ── */
    .bottom {
      position: fixed;
      bottom: 2.2rem;
      left: 0; right: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      gap: 2rem;
      opacity: 0;
      animation: fadeUp 0.9s 1.6s ease forwards;
    }
    .bottom a {
      text-decoration: none;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245,237,224,0.42);
      transition: color 0.2s;
    }
    .bottom a:hover { color: var(--gold-light); }

    /* ── LOGO ── */
    .logo {
      position: fixed;
      top: 2rem; left: 50%; transform: translateX(-50%);
      z-index: 3;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(245,237,224,0.55);
      opacity: 0;
      animation: fadeDown 0.9s 0.15s ease forwards;
    }

    /* ── KEYFRAMES ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-14px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 5.5rem;
      left: 50%; transform: translateX(-50%) translateY(20px);
      background: rgba(200,151,42,0.92);
      color: var(--charcoal);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      padding: 0.6rem 1.4rem;
      border-radius: 2px;
      opacity: 0;
      transition: all 0.4s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 10;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="grain"></div>

  <p class="logo">Saveur</p>

  <div class="stage">
    <p class="eyebrow">Something delicious is on its way</p>

    <div class="divider">
      <span></span>
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
      </svg>
      <span></span>
    </div>

    <h1 class="headline">The Table<br>is Being<br><em>Set.</em></h1>

    <p class="sub">
      A culinary experience crafted with care.<br>
      We're putting the final touches on something truly worth the wait.
    </p>

    <div class="countdown" id="countdown">
      <div class="unit"><span class="unit-num" id="days">00</span><span class="unit-label">Days</span></div>
      <div class="dot-sep">·</div>
      <div class="unit"><span class="unit-num" id="hours">00</span><span class="unit-label">Hours</span></div>
      <div class="dot-sep">·</div>
      <div class="unit"><span class="unit-num" id="mins">00</span><span class="unit-label">Mins</span></div>
      <div class="dot-sep">·</div>
      <div class="unit"><span class="unit-num" id="secs">00</span><span class="unit-label">Secs</span></div>
    </div>

    <div class="notify">
      <input type="email" id="email" placeholder="Your email address" />
      <button onclick="handleNotify()">Notify Me</button>
    </div>
  </div>

  <div class="bottom">
    <a href="#">Instagram</a>
    <a href="#">Reservations</a>
    <a href="#">Contact</a>
  </div>

  <div class="toast" id="toast">You're on the list — see you soon ✦</div>

  <script>
    // ── COUNTDOWN to a launch date ──
    const launch = new Date('2025-09-01T18:00:00');

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now  = new Date();
      const diff = Math.max(0, launch - now);
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000)  / 60000);
      const s = Math.floor((diff % 60000)    / 1000);
      document.getElementById('days').textContent  = pad(d);
      document.getElementById('hours').textContent = pad(h);
      document.getElementById('mins').textContent  = pad(m);
      document.getElementById('secs').textContent  = pad(s);
    }
    tick();
    setInterval(tick, 1000);

    // ── NOTIFY ──
    function handleNotify() {
      const v = document.getElementById('email').value.trim();
      if (!v || !v.includes('@')) return;
      document.getElementById('email').value = '';
      const t = document.getElementById('toast');
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3200);
    }

    document.getElementById('email').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleNotify();
    });
  </script>
</body>
</html>
